<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>교재 - 초시대 가치 교육</title>
    <link rel="stylesheet" href="css/style.css?v=20260714h" />
</head>

<body>
    <header class="header">
        <div class="header__container">
            <a href="index.html" class="logo">
                <img src="images/TVE_logo_202503.png" alt="초시대 가치 교육" class="logo__img" />
            </a>
            <nav class="nav" aria-label="주요 메뉴">
                <div class="nav__pill">
                    <a href="why-now.html" class="nav__link">교육 철학</a>
                    <a href="programs.html" class="nav__link">교육과정</a>
                    <a href="curriculum.html" class="nav__link is-active">교재</a>
                    <a href="team.html" class="nav__link">제작진</a>
                    <a href="reviews.html" class="nav__link">후기</a>
                    <a href="contact.html" class="nav__link btn--contact"><span class="btn-dot" style="background:var(--dot-lavender)"></span>문의</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="curriculum reveal bg-soft-yellow">
            <div class="container">
                <div class="section-header">
                    <span class="section-label">Showcase</span>
                    <h2 class="section-title">실제 교재 구성</h2>
                    <p class="section-subtitle">
                        아이들의 시선을 사로잡는 디자인과 깊이 있는 가치를 담은 실제 교재의 구성을 확인해보세요.
                    </p>
                </div>

                <div class="curriculum__showcase">
                    <div class="curriculum__card surface--soft">
                        <div class="curriculum__visual hover-stack">
                            <img src="images/science_inner_1.png.webp" alt="과학 내지 1" class="curriculum__img stack-img stack-img--back2" onerror="this.src='https://placehold.co/400x560/f8f9fa/adb5bd?text=Inner+Page+1'" />
                            <img src="images/science_inner_2.png.webp" alt="과학 내지 2" class="curriculum__img stack-img stack-img--back1" onerror="this.src='https://placehold.co/400x560/e9ecef/6c757d?text=Inner+Page+2'" />
                            <img src="images/science_cover.jpg" alt="과학 교과서 표지" class="curriculum__img stack-img stack-img--front" />
                        </div>
                        <div class="curriculum__info">
                            <div class="curriculum__tag">Category: Science</div>
                            <h3 class="curriculum__item-title">과학 - 창조의 질서</h3>
                            <p class="curriculum__item-desc">세상의 모든 조화 속에 숨겨진 원리와 창조의 질서를 발견하며 지적 호기심을 일깨웁니다.</p>
                        </div>
                    </div>

                    <div class="curriculum__card surface--soft">
                        <div class="curriculum__visual hover-stack">
                            <img src="images/social_inner_1.png.webp" alt="사회 내지 1" class="curriculum__img stack-img stack-img--back2" onerror="this.src='https://placehold.co/400x560/f8f9fa/adb5bd?text=Inner+Page+1'" />
                            <img src="images/social_inner_2.png.webp" alt="사회 내지 2" class="curriculum__img stack-img stack-img--back1" onerror="this.src='https://placehold.co/400x560/e9ecef/6c757d?text=Inner+Page+2'" />
                            <img src="images/social_cover.jpg" alt="사회 교과서 표지" class="curriculum__img stack-img stack-img--front" />
                        </div>
                        <div class="curriculum__info">
                            <div class="curriculum__tag">Category: Social Studies</div>
                            <h3 class="curriculum__item-title">사회 - 공동체의 가치</h3>
                            <p class="curriculum__item-desc">함께 살아가는 세상 속에서 그리스도인의 책임과 이웃을 향한 사랑의 가치를 구체적으로 배웁니다.</p>
                        </div>
                    </div>
                </div>

                <div class="curriculum__action reveal" style="text-align: center; margin-top: 6rem; margin-bottom: 2rem;">
                    <a href="https://smartstore.naver.com/soonlee" target="_blank" rel="noopener noreferrer" class="btn--outline-minimal">
                        네이버 스마트스토어 교재 구매 ➔
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/animation.js"></script>
</body>

</html>
